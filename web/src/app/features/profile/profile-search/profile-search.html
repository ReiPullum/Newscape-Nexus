<section class="profile-shell">

  <div class="profile-header">
    <div class="header-title">
      <h2>Profile Search</h2>
      <span class="header-subtitle">RuneScape 3 Player Lookup</span>
    </div>

    <div class="search-container">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          type="text"
          [(ngModel)]="username"
          (keyup.enter)="searchPlayer()"
          placeholder="Enter a player name..."
          class="search-input"
        />
      </div>
      <button class="search-btn" (click)="searchPlayer()">Search</button>
    </div>
  </div>

  <div class="empty-state" *ngIf="!searched">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
    <p>Enter a player name to look up their profile</p>
  </div>

  <div class="coming-soon" *ngIf="searched">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 6v6l4 2"/>
    </svg>
    <p>Results for <span class="username-highlight">{{ lastSearch }}</span> coming soon</p>
    <span class="coming-soon-sub">API integration in progress</span>
  </div>

</section>
