<!-- Custom titlebar -->
<div class="titlebar">
  <span class="titlebar-logo">Newscape Nexus</span>
  <div class="titlebar-controls">
    <button class="titlebar-btn minimize" onclick="window.minimizeApp?.()">─</button>
    <button class="titlebar-btn maximize" onclick="window.maximizeApp?.()">□</button>
    <button class="titlebar-btn close" onclick="window.close()">✕</button>
  </div>
</div>

<!-- App layout -->
<div class="app-shell">

  <!-- Sidebar nav -->
  <nav class="sidebar">
    <ul class="nav-list">
      <li class="nav-item">
        <a routerLink="/ge" routerLinkActive="active" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/>
          </svg>
          <span>GE Tracker</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/profile" routerLinkActive="active" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <span>Profile Search</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/skills" routerLinkActive="active" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/>
          </svg>
          <span>Skills</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/items" routerLinkActive="active" class="nav-link">

            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          </svg>
          <span>Item Database</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/settings" routerLinkActive="active" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>

  <!-- Page content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
